name: Upload IPA

on:
  workflow_dispatch:
  push:
    paths:
      - '**.ipa'

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Buscar IPA
        run: |
          find . -name "*.ipa"

      - name: Subir IPA como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPA-Download
          path: "**/*.ipa"
          if-no-files-found: error
          retention-days: 30
